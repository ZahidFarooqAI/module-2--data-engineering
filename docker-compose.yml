version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: postgres_container
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/create_tables.sql:/docker-entrypoint-initdb.d/create_tables.sql
    networks:
      - data_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_container
    restart: always
    env_file:
      - .env
    ports:
      - "8080:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json
    depends_on:
      - postgres
    networks:
      - data_network

  ingestion:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ingestion_container
    depends_on:
      - postgres
    env_file:
      - .env
    networks:
      - data_network

volumes:
  postgres_data:

networks:
  data_network:
    driver: bridge